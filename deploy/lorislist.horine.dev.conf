# Apache 2.4 reverse proxy for Lori's List.
#
#   browser --https--> Apache (lorislist.horine.dev:443) --http--> Node (127.0.0.1:3001)
#
# Install (RHEL/CentOS/Rocky/Alma layout; on Debian/Ubuntu use
# /etc/apache2/sites-available/ and `a2ensite`, and change the log paths):
#   1. Copy this file to /etc/httpd/conf.d/lorislist.horine.dev.conf
#   2. Make sure these modules are loaded: proxy, proxy_http, ssl, headers, rewrite
#      (on Debian: a2enmod proxy proxy_http ssl headers rewrite)
#   3. Point the two SSLCertificate lines at your certificate. It must cover BOTH
#      names (lorislist.horine.dev and lorislist.horinetech.com), for example:
#        certbot certonly --webroot -w /var/www/html \
#          -d lorislist.horine.dev -d lorislist.horinetech.com
#      (the paths below are where Let's Encrypt / certbot puts them)
#   4. apachectl configtest && systemctl reload httpd
#
# The Node app must be configured to match (config.js, or environment variables):
#   server: { host: '127.0.0.1', port: '3001' }     (or PORT=3001)
#   url:    'https://lorislist.horine.dev'          (the main address, used in email links)
# Requests from either hostname are accepted: the app compares the browser's
# Origin with the Host header, and Apache passes the Host through unchanged.
# Login cookies belong to one hostname, so someone who signs in on one address
# is not automatically signed in on the other.
#   session.cookieSecure: true                      (or COOKIE_SECURE=true)
# It must only listen on 127.0.0.1 so that nobody can reach it without going
# through this proxy. It trusts the X-Forwarded-Proto header set below.

# Plain HTTP: send everything to HTTPS
<VirtualHost *:80>
    ServerName lorislist.horine.dev
    ServerAlias lorislist.horinetech.com

    # keep whichever hostname the visitor used
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  logs/lorislist-error.log
    CustomLog logs/lorislist-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName lorislist.horine.dev
    ServerAlias lorislist.horinetech.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/lorislist.horine.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lorislist.horine.dev/privkey.pem
    # Written as "all minus the old ones" so it loads on any Apache/OpenSSL
    # build; TLS 1.3 is used automatically wherever the server supports it.
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Do not act as a general forward proxy
    ProxyRequests Off
    # Pass the original Host header to Node (the CSRF origin check compares it)
    ProxyPreserveHost On

    # Tell Node the browser connection was HTTPS. `set` replaces anything the
    # client sent, so this cannot be spoofed.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        / http://127.0.0.1:3001/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3001/

    # Browser hardening. HSTS is remembered by browsers for the whole period,
    # so once this is live the site must keep working over HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  logs/lorislist-ssl-error.log
    CustomLog logs/lorislist-ssl-access.log combined
</VirtualHost>
