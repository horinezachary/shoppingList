openapi: 3.0.0
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/horinezachary/LorisList/1.0.0
info:
  version: "1.0.0"
  title: Lori's List API
  description: >-
    This API is used to interface with the Lori's List database
security:
  - application:
      - read
      - write
paths:
  /users:
    post:
      summary: Create a new User.
      description: >
        Create and store a new application User with specified data and adds it to the application's database.
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        description: A User object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: New User successfully added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: >
                      Unique ID of the created User.
                    example: "janedoe"
        '400':
          description: >
            The request body was either not present or did not contain a valid User object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/login:
    post:
      summary: Log in a User.
      description: >
        Authenticate a specific User with their email address and password.
      operationId: authenticateUser
      tags:
        - Users
      requestBody:
        required: true
        description: >
          Email address and plain-text password for the User being authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
            example:
              email: example@horine.dev
              password: password
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: >
                      A JWT authentication token.
                    example: aaaaaaaa.bbbbbbbb.cccccccc
        '400':
          description: >
            The request body was either not present or did not contain all of the required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >
            The specified credentials were invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    parameters:
      - name: id
        in: path
        description: >
          Unique username of a User.
        schema:
          type: string
        example: "janedoe"
        required: true

    get:
      summary: Fetch data about a specific User.
      description: >
        Returns information about the specified User.
      operationId: getUserByUsername
      tags:
        - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified User `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update data for the specified user.
      description: >
        Performs a partial update on the data for the user.
      operationId: updateUserById
      tags:
        - Users
      parameters:
      - name: id
        in: path
        description: >
          id of the requested user
        schema:
          type: integer
        example: "123456"
        required: true
      requestBody:
        description: >
          Partial updates to be applied to the specified user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Success
        '400':
          description: >
            The request body was either not present or did not contain any fields related to User objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove a specific user from the database.
      description: >
        Completely removes the user and all their associated data from the database.
      operationId: removeUserById
      tags:
        - Users
      responses:
        '204':
          description: Success
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/lists:
    parameters:
      - name: id
        in: path
        description: >
          Unique username of a user
        schema:
          type: string
        example: "janedoe"
        required: true
    get:
      summary: Fetch all of a user's lists (that you have access to)
      description: >
        Returns a JSON object with an array of lists (without list elements)
      operationId: getUserLists
      tags:
        - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified User `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a new list owned by the given user
      description: >
        Add a list with the given name and color, with the owner id given
      operationId: addUserList
      tags:
        - Users
      requestBody:
        required: true
        description: >
          provide a list name and color, the owner id is pulled from url
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/List'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified User `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/autofill:
    parameters:
      - name: id
        in: path
        description: >
          Unique username of a user
        schema:
          type: string
        example: "janedoe"
        required: true
    get:
      summary: Fetch all of a user's autofill items
      description: >
        Returns a JSON object with an array of autofill items
      operationId: getUserAutofill
      tags:
        - Users
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Autofill'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified User `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a new list owned by the given user
      description: >
        Add an autofill item to a user (automatically done when an item is added to a list, but can be done manually)
      operationId: addUserAutofill
      tags:
        - Users
      requestBody:
        required: true
        description: >
          provide a name for the new autofill item, owner is pulled from url path
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Autofill'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Autofill'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified User `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove a specific autofill entry from the database.
      description: >
        Completely removes the autofill entry form the database. can only be done by the owner of the entry
      operationId: removeAutofillById
      tags:
        - Users
      responses:
        '204':
          description: Success
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /lists:
    get:
      summary: Fetch all lists a user has access to
      description: >
        Returns a JSON object with an array of Userlists and sharedLists (without list elements)
      operationId: getLists
      tags:
        - Lists
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            The user has no lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /lists/{id}:
    parameters:
        - name: id
          in: path
          description: >
            id of the requested list
          schema:
            type: integer
          example: "123456"
          required: true
    get:
      summary: Fetch a specific list
      description: >
        Returns a JSON object with the list specified, including list elements
      operationId: getDetailedList
      tags:
        - Lists
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedList'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            The user has no lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update data for the specified list.
      description: >
        Performs a partial update on the data for the list.
      operationId: updateListById
      tags:
        - Lists
      requestBody:
        description: >
          Partial updates to be applied to the specified list.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/List'
      responses:
        '200':
          description: Success
        '400':
          description: >
            The request body was either not present or did not contain any fields related to List objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove a specific List from the database.
      description: >
        Completely removes the data for the specified list, including all list elements.  Only an authenticated whose ID matches the `owner` of the List with the given `listId` can delete a List.
      operationId: removeListById
      tags:
        - Lists
      responses:
        '204':
          description: Success
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /list/{id}/item:
    parameters:
      - name: id
        in: path
        description: >
          id of the requested list
        schema:
          type: integer
        example: "123456"
        required: true
    post:
      summary: Add a new list Item to the given List
      description: >
        Add an Item to the list with the given list id
      operationId: addListItem
      tags:
        - Items
      requestBody:
        required: true
        description: >
          provide an item quantity (optional) and item name
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove a specific Item from the database.
      description: >
        Completely removes the data for the specified Item, and removes it's link to the list.  Only an authenticated User with edit access to the List with the given `listId`.
      operationId: removeListItemById
      tags:
        - Items
      responses:
        '204':
          description: Success
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /list/{id}/share:
    parameters:
      - name: id
        in: path
        description: >
          id of the requested list
        schema:
          type: integer
        example: "123456"
        required: true
    post:
      summary: Add a new share record for the given list
      description: >
        Share the list with the given id with the user
      operationId: ShareListById
      tags:
        - Lists
      requestBody:
        required: true
        description: >
          provide a user and level to share
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  example: "johndoe"
                permissions:
                  type: object
                  properties:
                    view:
                      type: boolean
                      example: "true"
                    add:
                      type: boolean
                      example: "true"
                    delete:
                      type: boolean
                      example: "true"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update sharing info for the specified list.
      description: >
        Performs a partial update on the sharing data for the list.
      operationId: updateUserShareById
      tags:
        - Lists
      requestBody:
        description: >
          Partial updates to be applied to the specified list.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareElement'
      responses:
        '200':
          description: Success
        '400':
          description: >
            The request body was either not present or did not contain any fields related to List objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Remove the sharing permissions for a given user
      description: >
        Share the list with the given id with the user
      operationId: UnShareListById
      tags:
        - Lists
      responses:
        '204':
          description: Success
        '403':
          description: >
            The request was not made by an authenticated User satisfying the authorization criteria described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Specified List `id` not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    application:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: 'http://example.com/oauth/token'
          scopes:
            write: allows modifying resources
            read: allows reading resources
  schemas:
    User:
      description: >
        An object representing information about an application user.
      type: object
      properties:
        uname:
          type: string
          description: Username of the User. This is required to be unique among all Users.
          example: janedoe
        fname:
          type: string
          description: First name of the User.
          example: Jane
        lname:
          type: string
          description: Last name of the User.
          example: Doe
        email:
          type: string
          description: >
            Email address for the User.  This is required to be unique among all Users.
          example: example@horine.dev
        password:
          type: string
          description: >
            The User's password (plaintext on login/register, hash on server request).  This is generated when creating a new User and checked against when logging in.
          example: password or '$2a$04$dEeAqgYktiz8nEEWMC8e4u2Ff/QWkfDR4TQbpKcdcbMr.a3gV89vy'
        last_web_change:
          type: integer
          description: Time of last change made in the database. used to determine input validity, and which piece of data is newer.
          example: '2020-11-02 03:05:14'
        showAlert:
          type: boolean
          description: Used for determining wether or not to show the tutorial box
          example: true
    List:
      type: object
      description: "A list of items that belongs to a user"
      properties:
        id:
          type: integer
          format: int6
          example: 123456
        name:
          type: string
          example: "Shopping List"
          description: The name of the list
        owner:
          type: string
          description: the username of the list owner
          example: janedoe
        list_color:
          type: string
          description: Hexadecimal representation of the list color
          example: FF6600
        last_change:
          type: integer
          description: Time of last change made in the database. used to determine input validity, and which piece of data is newer.
          example: '2020-11-02 03:05:14'

    DetailedList:
      type: object
      description: "A detailed list of items that belongs to a user"
      properties:
        id:
          type: integer
          format: int6
          example: 123456
        name:
          type: string
          example: "Shopping List"
          description: The name of the list
        owner:
          type: string
          description: the username of the list owner
          example: janedoe
        list_color:
          type: string
          description: Hexadecimal representation of the list color
          example: FF6600
        last_change:
          type: integer
          description: Time of last change made in the database. used to determine input validity, and which piece of data is newer.
          example: '2020-11-02 03:05:14'
        list_items:
          type: object
          description: List of items contianed in the list (Item object)
    ShareElement:
      description: Format for returning a share object for a list
      properties:
        user:
          type: string
          example: "johndoe"
        permissions:
          type: object
          properties:
            view:
              type: boolean
              example: "true"
            add:
              type: boolean
              example: "true"
            delete:
              type: boolean
              example: "true"
    Item:
      description: A list Item, belongs to a list, has a quantity, and an item name
      properties:
        id:
          type: integer
          example: 123456
        list_id:
          type: integer
          example: 123456
        name:
          type: string
          example: "bananas"
        count:
          type: integer
          example: "5"
    Autofill:
      description: A non-quantitied item that is not linked to a list used for autofill. (specific to a user)
      properties:
        id:
          type: integer
          example: 123456
        name:
          type: string
          example: "bananas"
        owner:
          type: string
          example: "janedoe"
    Error:
      description: >
        An object representing an error response from the API.
      type: object
      properties:
        error:
          type: string
          description: A message describing the Error.
